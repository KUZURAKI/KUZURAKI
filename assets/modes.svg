<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
  <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.10"/>
</filter>
<filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
  <feGaussianBlur stdDeviation="3.5"/>
</filter>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FAFAFA"/><stop offset="1" stop-color="#D2D2D2"/>
</linearGradient>
</defs><rect width="1200" height="640" rx="24" fill="#EDEDED"/><text x="600" y="96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="400" fill="#151515" text-anchor="middle" letter-spacing="-1">Режимы работы</text><text x="600" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#333" text-anchor="middle" >Физические переключатели в голове: один режим — одна задача.</text><text x="600" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#333" text-anchor="middle" >Большие кнопки — чтобы не промахнуться в три часа ночи.</text><rect x="320" y="300" width="560" height="150" rx="44" fill="url(#body)" stroke="#C6C6C6" filter="url(#shadow)"/><text x="398" y="330" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#555" text-anchor="middle" >DESKTOP</text><rect x="364" y="341" width="68" height="18" rx="9" fill="#EB4B1F"/><text x="398" y="354" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" >BACKEND</text><text x="398" y="378" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#555" text-anchor="middle" >OFF</text><text x="398" y="402" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#555" text-anchor="middle" >BOTS</text><text x="398" y="426" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#555" text-anchor="middle" >DEPLOY</text><path d="M436 342 q20 0 30 12" fill="none" stroke="#777" stroke-width="1.4"/><rect x="452" y="350" width="78" height="26" rx="13" fill="#EB4B1F"/><rect x="460" y="358" width="30" height="10" rx="5" fill="#fff" opacity="0.6"/><rect x="560" y="316" width="180" height="118" rx="14" fill="#FCFCFC" stroke="#D3D3D3"/><text x="650" y="382" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="20" font-weight="500" fill="#333" text-anchor="middle" >git push</text><circle cx="760" cy="318" r="16" fill="#EB4B1F"/><text x="760" y="321" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="8" font-weight="700" fill="#fff" text-anchor="middle" >back</text><circle cx="816" cy="376" r="48" fill="#FAFAFA" stroke="#D3D3D3"/><circle cx="816" cy="376" r="38" fill="none" stroke="#EB4B1F" stroke-width="2.5" stroke-dasharray="2 4"/><text x="816" y="381" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="13" font-weight="600" fill="#333" text-anchor="middle" >ok</text><text x="70" y="240" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >Desktop</text><text x="70" y="260" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >Tauri + React: окна,</text><text x="70" y="276" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >трей, автозапуск</text><polyline points="214,235 290,235 350,326" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="350" cy="326" r="3" fill="#9A9A9A"/><text x="70" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >Backend</text><text x="70" y="342" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >Axum и FastAPI —</text><text x="70" y="358" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >API, базы, очереди</text><polyline points="214,317 290,317 350,350" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="350" cy="350" r="3" fill="#9A9A9A"/><text x="70" y="404" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >Боты</text><text x="70" y="424" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >Telegram: заказы,</text><text x="70" y="440" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >отзывы, рассылки</text><polyline points="214,399 290,399 350,398" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="350" cy="398" r="3" fill="#9A9A9A"/><text x="70" y="486" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >Деплой</text><text x="70" y="506" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >VPS, Docker, nginx,</text><text x="70" y="522" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >SSL за одну кнопку</text><polyline points="214,481 290,481 350,422" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="350" cy="422" r="3" fill="#9A9A9A"/><text x="520" y="222" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >Кнопка git push</text><text x="520" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >Коммит и пуш. Работает</text><text x="520" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >и как OK в меню.</text><line x1="650" y1="270" x2="650" y2="340" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="650" cy="340" r="3" fill="#9A9A9A"/><text x="910" y="222" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >Кнопка Back</text><text x="910" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >git revert — если что-то</text><text x="910" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >пошло не так.</text><polyline points="905,236 880,236 768,306" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="768" cy="306" r="3" fill="#9A9A9A"/><line x1="491" y1="376" x2="491" y2="520" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="491" cy="376" r="3" fill="#9A9A9A"/><text x="510" y="530" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >5-позиционный селектор</text><text x="510" y="550" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >Переключение между режимами</text><polyline points="850,414 900,520 912,520" fill="none" stroke="#9A9A9A" stroke-width="1"/><circle cx="850" cy="414" r="3" fill="#9A9A9A"/><text x="920" y="525" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#151515" text-anchor="start" >Колесо прокрутки</text><text x="920" y="545" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >Листаю логи и документацию,</text><text x="920" y="561" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A8A8A" text-anchor="start" >OK — запуск сборки.</text></svg>